schema_version: "1.1.0"
distribution_spec: "DPA/PDA v1.1.0-FROZEN"
distribution_id: "DIST-EAORCS-2026.2.0-LTS"
product_id: "eaorcs"
product_name: "Enterprise Autonomous Operation & Regulatory Compliance System"
release_version: "2026.2.0-LTS"
lifecycle_stage: "GA"
release_date: "2026-08-02"

author: "Ujomor Engineering Governance Authority"
organization: "Ujomor Systems & EAORCS Ecosystem Governance"
classification: "GOVERNMENT | ENTERPRISE | RESTRICTED"

compatibility_matrix_reference: "compatibility_matrix.json"

packages:
  capsule:
    extension: ".ecap"
    packer: "engine/packaging/CapabilityCapsulePacker.js"
    signature_algorithm: "Ed25519"
    slsa_level: "SLSA Level 4"
  package:
    extension: ".epkg"
    packer: "engine/packaging/StandardPackagePacker.js"
    signature_algorithm: "Ed25519"
    slsa_level: "SLSA Level 4"
  bundle:
    extension: ".ebundle"
    packer: "engine/packaging/EnterpriseBundlePacker.js"
    signature_algorithm: "Ed25519"
    slsa_level: "SLSA Level 4"

verification:
  dri_threshold: 95.0
  dri_target: 100.0
  governance_status: "APPROVED_FOR_DISTRIBUTION"
