# EAORCS Enterprise Configuration Profile
# Authority: Air Roofers Systems Engineering & Governance Authority
# Ecosystem: Air Roofers Federated Ecosystem (airroofers.eu)
schemaVersion: "2026.1.0"
governanceAuthority: "Air Roofers Systems Engineering & Governance Authority"
organization: "Chicitadel / Air Roofers SASU"
environment: "PRODUCTION_ENTERPRISE"
classification: "ENTERPRISE_GOVERNED"
federatedDomain: "eaorcs.airroofers.eu"

registry:
  endpoint: "https://products.airroofers.eu/v1/descriptors/eaorcs"
  discoveryEnabled: true
  zeroHardcodingEnforced: true

audit:
  profile: "FULL_ENTERPRISE_STRICT"
  trustScoreThreshold: 90.0
  readinessThreshold: 85.0
  securitySeverityGate: "CRITICAL_ZERO_TOLERANCE"
  enableSyntheticTelemetry: true
  enableDslEvaluation: true

storage:
  driver: "FILE_SYSTEM"
  evidencePath: "./storage/evidence"
  telemetryPath: "./storage/telemetry"
  logsPath: "./storage/logs"

telemetry:
  multiTenantSectors:
    - "FINANCIAL_SERVICES"
    - "GOVERNMENT_DEFENSE"
    - "HEALTHCARE_HIPAA"
    - "ENTERPRISE_SAAS"
  metricsIntervalMs: 5000
  exportFormats: ["JSON", "PROMETHEUS", "OPEN_TELEMETRY"]

compliance:
  standards:
    - "ISO 27001:2022"
    - "SOC 2 Type II"
    - "OWASP ASVS v4.0.3"
    - "NIST SP 800-53 Rev 5"
    - "SLSA Level 4"
  signatureAlgorithm: "Ed25519"
  hashAlgorithm: "SHA-256"

canonicalDomains:
  identity: "https://identity.airroofers.eu"
  workspace: "https://workspace.airroofers.eu"
  products: "https://products.airroofers.eu"
  licensing: "https://licensing.airroofers.eu"
  downloads: "https://downloads.airroofers.eu"
  billing: "https://billing.airroofers.eu"
  operations: "https://operations.airroofers.eu"
  support: "https://support.airroofers.eu"
