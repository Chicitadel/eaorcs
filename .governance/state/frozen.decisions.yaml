  - id: ADR-23-04
    title: DigiCert RFC 3161 TSA Receipt Graph Integration and Auditor Token Verification
    status: APPROVED
    frozen: true
    rationale: Independent assurance requires RFC 3161 TSA receipt graphs and read-only auditor verification token bridges
  - id: ADR-24-01
    title: Persistent Execution Program Platform Runtime & Deployment Provenance Standard
    status: APPROVED
    frozen: true
    rationale: Every release candidate must pass live environment verification in hardened zero-trust clusters bound to git commit SHA b9f3108c7e4d2a1068412891
  - id: ADR-24-02
    title: Continuous OpenAPI & AsyncAPI Contract Execution Matrix Standard
    status: APPROVED
    frozen: true
    rationale: API endpoints must undergo continuous schema conformance execution mapped onto a zero-drift contract graph
  - id: ADR-24-03
    title: Signed CycloneDX 1.5 SBOM Registry Graph V2 and Multi-Year Telemetry Lake
    status: APPROVED
    frozen: true
    rationale: Security operations require signed SBOM graphs and multi-year OTLP span/Prometheus metric archives
  - id: ADR-24-04
    title: DigiCert RFC 3161 TSA Receipt Graph V2 Integration and Auditor Token Verification
    status: APPROVED
    frozen: true
    rationale: Independent assurance requires RFC 3161 TSA receipt graphs and read-only auditor verification token bridges
  - id: ADR-25-01
    title: Live Signal Substantiation Tuple & Immutable Provenance Binding Standard
    status: APPROVED
    frozen: true
