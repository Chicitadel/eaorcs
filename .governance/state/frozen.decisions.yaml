    status: APPROVED
    frozen: true
    rationale: Version 1.0.0-rc1 must pass reproducible build verification and cosign artifact signatures bound to git commit SHA d9e5201a9f23c51085920312
  - id: ADR-26-02
    title: Product Documentation Suite and Developer Ecosystem SDK Publication Standard
    status: APPROVED
