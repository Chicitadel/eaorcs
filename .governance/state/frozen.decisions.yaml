  - id: ADR-RC1-01
    title: Feature Freeze & Transition to Release Milestones
    status: APPROVED
    frozen: true
    rationale: Engineering expansion frozen, feature freeze declared, and transition to release candidate milestone EAORCS_2026.1.0_RC1 under architecture authority governance.
  - id: ADR-GA-01
    title: 2026.1.0-GA Implementation Baseline Closure
    status: APPROVED
    frozen: true
    rationale: The major engineering cycle is declared complete. Architecture, blueprint, domain model, API baseline, legal baseline, contracts, and protocols are permanently frozen. Implementation maturity score 98.5/100. All 15 master qualification suites pass. Future work follows semantic versioning per ADR-GA-02.
  - id: ADR-GA-02
    title: Semantic Versioning & Future Work Governance Policy
    status: APPROVED
    frozen: true
    rationale: All future changes follow semantic versioning (2026.1.x patches, 2026.2.0 enhancements, 2027.x major). Core architectural redesign prohibited unless demonstrable need arises. Ten defined change categories enforced. Governance gates required for all release tiers. See docs/governance/FUTURE_WORK_POLICY.md.
