  - id: ADR-17-01
    title: Operational Substantiation via Independent Evidence Generation (Phase 17)
    status: APPROVED
    frozen: true
    rationale: Production evidence must be generated from live engines, not static assertions
  - id: ADR-17-02
    title: SLSA Level 3 as Minimum Release Attestation Standard
    status: APPROVED
    frozen: true
    rationale: Ed25519 signing + RFC 3161 timestamps + reproducible builds required for all releases
  - id: ADR-17-03
    title: Full OpenTelemetry Stack as Observability Standard
    status: APPROVED
    frozen: true
    rationale: Prometheus + Grafana + Jaeger + AlertManager mandatory for operational evidence
  - id: ADR-17-04
    title: 9-Stream Concurrent Go-Live Governance Model
    status: APPROVED
    frozen: true
    rationale: Commercial launch clearance requires all 9 Phase 17 streams to achieve VERIFIED status
  - id: ADR-18-01
    title: Living Evidence Framework - Append-Only Ledger Pattern for All Operational Evidence
    status: APPROVED
    frozen: true
    rationale: Evidence must be time-series/append-only with chain-of-custody hashing not point-in-time assertions
  - id: ADR-18-02
    title: Objective Threshold Evaluation as Launch Approval Standard
    status: APPROVED
    frozen: true
    rationale: Launch gates must evaluate measurable thresholds (uptime >=99.9%, error <=0.1%) not static 100/100 scores
  - id: ADR-18-03
    title: Chain-of-Custody as Mandatory Pattern for External Auditability
    status: APPROVED
    frozen: true
    rationale: All security, compliance and release evidence must carry cryptographic provenance chains
  - id: ADR-18-04
    title: Runtime-Generated Compliance Evidence Standard
    status: APPROVED
    frozen: true
    rationale: Compliance mappings must derive from live telemetry systems not static assertions
  - id: ADR-19-01
    title: Operational Connector Pattern as Standard for Live System Integration
    status: APPROVED
    frozen: true
    rationale: All Phase 19 engines must carry dataSource LIVE_SYSTEM and externalVerificationUrl fields
  - id: ADR-19-02
    title: External Read-Only Auditor Access as Mandatory Evidence Consumer Interface
    status: APPROVED
    frozen: true
    rationale: Independent auditors must verify provenance without modifying evidence - canModify always false
  - id: ADR-19-03
    title: Procurement Evidence Portal as Commercial Trust Mechanism
    status: APPROVED
    frozen: true
    rationale: RFP bundles and due diligence packages must be signed, watermarked and downloadable externally
  - id: ADR-19-04
    title: Continuous Readiness Score Replacing Milestone-Based Launch Gates
    status: APPROVED
    frozen: true
    rationale: milestoneBasedScoring must be false - readiness derived from live measured evidence only
  - id: ADR-20-01
    title: Live Target Runtime Validation as Mandatory Deployment Gate
    status: APPROVED
    frozen: true
    rationale: Every release candidate must pass live environment verification in hardened zero-trust clusters
  - id: ADR-20-02
    title: Live Contract Interoperability Enforcement Against Endpoint Schemas
    status: APPROVED
    frozen: true
    rationale: Contract drift blocker must enforce zero breaking changes against live services
  - id: ADR-20-03
    title: RFC 3161 Compliant External Timestamping and Zero-Knowledge Proofs
    status: APPROVED
    frozen: true
    rationale: External verification must support RFC 3161 timestamps and zero-knowledge proofs
  - id: ADR-20-04
    title: Continuous Runtime Governance and Blueprint Drift Prevention
    status: APPROVED
    frozen: true
    rationale: Blueprint-to-implementation conformance is continuously monitored with zero drift tolerance
  - id: ADR-21-01
    title: K8s Event Log Ingestion and Continuous Pod Runtime Proof Standard
    status: APPROVED
    frozen: true
    rationale: Continuous runtime proof requires live K8s event log collection and zero pod drift
  - id: ADR-21-02
    title: Live OTLP Trace Bundle & Prometheus Time-Series Retention Standard
    status: APPROVED
    frozen: true
    rationale: Production observability must retain OTLP trace bundles and Prometheus time-series for 365 days
  - id: ADR-21-03
    title: Signed SBOM Registry and CVE Scan History Attestation Standard
    status: APPROVED
    frozen: true
    rationale: Security operations require signed CycloneDX 1.5 SBOM registries and zero unaddressed CVEs
  - id: ADR-21-04
    title: RFC 3161 TSA Timestamp Token Integration for Operational Proofs
    status: APPROVED
    frozen: true
    rationale: All independent assurance evidence must carry verifiable RFC 3161 DigiCert/internal TSA timestamp receipts
  - id: ADR-22-01
    title: Continuous K8s Telemetry Ingestion and Deployment Proof Archive
    status: APPROVED
    frozen: true
    rationale: Long-term operational validation requires 90-day deployment proof archives and active pod telemetry bridges
  - id: ADR-22-02
    title: Live OTLP Span Bundle Archiving and 365-Day Prometheus Timeseries Ledger
    status: APPROVED
    frozen: true
    rationale: Observability ledgers must retain OTLP trace span bundles and Prometheus timeseries for 365 days
  - id: ADR-22-03
    title: Signed CycloneDX SBOM Registry Archive and Zero Vulnerability Policy
    status: APPROVED
    frozen: true
    rationale: Security operations require signed SBOM archives and continuous live vulnerability scan ledgers
  - id: ADR-22-04
    title: DigiCert RFC 3161 TSA Timestamp Receipt Token Integration
    status: APPROVED
    frozen: true
    rationale: External proof engines must issue and verify RFC 3161 TSA timestamp receipt tokens
  - id: ADR-23-01
    title: Evidence Lake Git Commit SHA & Build Provenance Binding Standard
    status: APPROVED
    frozen: true
    rationale: Every evidence graph node and telemetry lake record must be bound to immutable git commit SHA and build ID provenance
  - id: ADR-23-02
    title: Continuous API Endpoint Contract Execution & Drift Graph Standard
    status: APPROVED
    frozen: true
    rationale: API endpoints must undergo continuous schema conformance execution mapped onto a zero-drift contract graph
  - id: ADR-23-03
    title: Signed CycloneDX 1.5 SBOM Registry Graph and Multi-Year Telemetry Archive
    status: APPROVED
    frozen: true
