  <text x="420" y="380" fill="#f59e0b" font-family="monospace" font-weight="bold" font-size="14">98.4</text>
  <text x="540" y="380" fill="#10b981" font-family="monospace" font-size="13">45,200</text>
  <rect x="660" y="365" width="60" height="20" fill="rgba(245, 158, 11, 0.2)" rx="10"/>
