  <text x="338" y="186" fill="#00f0ff" font-family="monospace" font-weight="bold" font-size="32">97.2%</text>
  <text x="338" y="210" fill="#10b981" font-family="sans-serif" font-size="11">MODULAR MONOLITH</text>

  <rect x="612" y="120" width="270" height="110" fill="url(#card-grad)" stroke="rgba(0, 240, 255, 0.15)" rx="12"/>
