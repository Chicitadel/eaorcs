  <text x="1100" y="340" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="12">VERIFIED</text>

  <text x="836" y="390" fill="#ffffff" font-family="sans-serif" font-size="14">SOC 2 Type II</text>
  <text x="1100" y="390" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="12">VERIFIED</text>

  <text x="836" y="440" fill="#ffffff" font-family="sans-serif" font-size="14">OWASP ASVS v4.0.3</text>
  <text x="1100" y="440" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="12">VERIFIED</text>

  <text x="836" y="490" fill="#ffffff" font-family="sans-serif" font-size="14">NIST SP 800-53 Rev 5</text>
  <text x="1100" y="490" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="12">VERIFIED</text>
