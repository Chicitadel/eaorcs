  <circle cx="64" cy="60" r="20" fill="#00f0ff" opacity="0.2"/>
  <circle cx="64" cy="60" r="12" fill="#00f0ff"/>
  <text x="100" y="55" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="18">EAORCS Web Observatory Dashboard</text>
  <text x="100" y="74" fill="#94a3b8" font-family="monospace" font-size="12">Enterprise Autonomous Observability &amp; Regulatory Compliance System</text>

  <rect x="1030" y="44" width="120" height="32" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" rx="16"/>
