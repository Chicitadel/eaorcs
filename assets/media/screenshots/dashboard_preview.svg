  <text x="240" y="430" fill="#94a3b8" font-family="monospace" font-size="13">TENANT-GOV-4481</text>
  <text x="420" y="430" fill="#f59e0b" font-family="monospace" font-weight="bold" font-size="14">99.1</text>
  <text x="540" y="430" fill="#10b981" font-family="monospace" font-size="13">18,400</text>
