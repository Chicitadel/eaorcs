  <text x="632" y="186" fill="#10b981" font-family="monospace" font-weight="bold" font-size="32">196.2k TPS</text>
  <text x="632" y="210" fill="#94a3b8" font-family="sans-serif" font-size="11">SLA: 99.999%</text>

  <rect x="906" y="120" width="270" height="110" fill="url(#card-grad)" stroke="rgba(0, 240, 255, 0.15)" rx="12"/>
