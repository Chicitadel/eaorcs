schema_version: "1.1.0"
distribution_spec: "DPA/PDA v1.1.0-FROZEN"
package_classification: "INTERNAL_ENGINEERING_AUDIT"

product:
  id: "eaorcs"
  name: "Enterprise Autonomous Operation & Regulatory Compliance System"
  version: "2026.2.0-LTS"
  framework_version: "3.0.0"
  lifecycle_state: "GA"
  federated_domain: "eaorcs.airroofers.eu"
  registry_endpoint: "https://products.airroofers.eu/v1/capabilities/eaorcs"
  governanceAuthority: "Ujomor Engineering Governance Authority"
  organization: "Air Roofers Platform Ecosystem & Ujomor Systems Engineering"
  owner: "Air Roofers Platform Engineering & Governance Team"
  bounded_context: "Software Trust, Runtime Observability & Regulatory Assurance"

distribution_artifacts:
  - id: "DIST-EAORCS-EXTERNAL-AUDIT"
    name: "EAORCS External Audit Package"
    file: "release/eaorcs_external_audit_package.zip"
    package_type: "INTERNAL_ENGINEERING_AUDIT"
    format: "ZIP"
  - id: "DIST-EAORCS-PEP-AUDIT"
    name: "EAORCS Performance & Engineering Audit Package"
    file: "release/eaorcs_pep_audit_package.zip"
    package_type: "INTERNAL_ENGINEERING_AUDIT"
    format: "ZIP"
  - id: "DIST-EAORCS-ECAP"
    name: "Enterprise Capability Capsule"
    extension: ".ecap"
    package_type: "PRODUCTION_RELEASE"
    format: "ECAP"
  - id: "DIST-EAORCS-EPKG"
    name: "Standard Enterprise Package"
    extension: ".epkg"
    package_type: "PRODUCTION_RELEASE"
    format: "EPKG"
  - id: "DIST-EAORCS-EBUNDLE"
    name: "Enterprise Bundle Archive"
    extension: ".ebundle"
    package_type: "PRODUCTION_RELEASE"
    format: "EBUNDLE"

packaged_metadata_files:
  - "distribution_manifest.yaml"
  - "product.manifest.yaml"
  - "compatibility_matrix.json"
  - "release/dna.json"
  - "release/passport.json"
  - "audit/ENGINEERING_PACKAGE_CLASSIFICATION.md"

governance_policies:
  protocol_freeze: true
  protocol_version: "v1.1.0-FROZEN"
  architecture_maturity: "MODULAR_MONOLITH"
  zero_trust:
    enabled: true
    deny_by_default: true
    require_mutual_tls: true
  compliance_standards:
    - id: "ISO_27001"
      status: "COMPLIANT"
    - id: "SOC_2_TYPE_II"
      status: "COMPLIANT"
    - id: "OWASP_ASVS_L3"
      status: "COMPLIANT"
    - id: "NIST_SP_800_161"
      status: "COMPLIANT"
    - id: "SLSA_LEVEL_4"
      status: "COMPLIANT"
    - id: "DORA_NIS2"
      status: "COMPLIANT"
    - id: "EU_AI_ACT"
      status: "COMPLIANT"
