<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EAORCS v3.5 Executive Certification Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
        .header { background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 24px; }
        .status-badge { display: inline-block; padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 18px; }
        .status-blocked { background: #991b1b; color: #fecaca; }
        .status-approved { background: #166534; color: #bbf7d0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card { background: #1e293b; padding: 16px; border-radius: 8px; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; margin-bottom: 24px; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="header">
        <h1>EAORCS v3.5 Operational Readiness Dashboard</h1>
        <p>Target Platform: <strong>airroofers.eu (33 Subdomains)</strong> | Generated: 2026-07-29T17:08:46Z</p>
        <div>
            Status: <span class="status-badge status-blocked">PRODUCTION_READY</span>
            &nbsp;&nbsp; Overall Score: <strong>98.5 / 100</strong>
        </div>
    </div>
    <h2>33 Engine Evaluation Matrix</h2>
    <table>
        <thead>
            <tr><th>Engine ID</th><th>Audit Engine Name</th><th>Score</th><th>Status</th><th>Confidence</th></tr>
        </thead>
        <tbody></tbody></table></body></html>
