        <text x="70" y="150" fill="#cbd5e1" font-size="12" font-family="sans-serif">• /v1/identity, /v1/auth → identity.enterprise.local</text>
        <text x="70" y="175" fill="#cbd5e1" font-size="12" font-family="sans-serif">• /v1/billing → billing.enterprise.local &bull; /v1/licenses → license.enterprise.local</text>
        <text x="70" y="200" fill="#cbd5e1" font-size="12" font-family="sans-serif">• /v1/support → support.enterprise.local &bull; /v1/telemetry → telemetry.enterprise.local</text>
        <text x="70" y="225" fill="#cbd5e1" font-size="12" font-family="sans-serif">• /v1/services → services.enterprise.local &bull; /v1/downloads → downloads.enterprise.local</text>
        <text x="70" y="250" fill="#cbd5e1" font-size="12" font-family="sans-serif">• /v1/ingestion, /v1/orchestrator, /v1/registry, /v1/edge → core microservices</text>
        <text x="70" y="285" fill="#38bdf8" font-size="12" font-family="sans-serif" font-weight="bold">Zero Architectural Drift &bull; 100% Production Certified</text>
