<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" style="background:#0f172a">
        <text x="30" y="40" fill="#38bdf8" font-size="18" font-family="sans-serif" font-weight="bold">Enterprise Platform Ecosystem Ingress Gateway Routing &amp; Microservice Topology</text>
        <rect x="50" y="80" width="800" height="230" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
