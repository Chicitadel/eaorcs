# Universal Autonomous AI Governance Operating System (UAIGOS)
# Module: Distribution Platform — Production Docker Compose Stack (Stream J)
# Standards: ISO 27001, SOC 2, OWASP ASVS, NIST

version: '3.8'

services:
  eaorcs-core:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    image: eaorcs/core:2026.1.0-lts
    container_name: eaorcs-core-engine
    restart: always
    environment:
      - NODE_ENV=production
      - HOST_TYPE=Docker
      - PORT=3000
      - DB_HOST=eaorcs-db
      - DB_PORT=3306
      - DB_NAME=eaorcs_prod
      - DB_USER=eaorcs_user
      - DB_PASS_FILE=/run/secrets/db_password
      - REDIS_HOST=eaorcs-redis
      - REDIS_PORT=6379
    ports:
      - "3000:3000"
    volumes:
      - eaorcs-storage:/app/storage
      - eaorcs-audits:/app/audits
    depends_on:
      eaorcs-db:
        condition: service_healthy
      eaorcs-redis:
        condition: service_healthy
    networks:
      - eaorcs-network
    healthcheck:
      test: ["CMD", "node", "cli/index.js", "health-check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    resources:
      limits:
        cpus: '2.0'
        memory: 2048M

  eaorcs-db:
    image: mysql:8.0
    container_name: eaorcs-db-server
    restart: always
    environment:
      MYSQL_DATABASE: eaorcs_prod
      MYSQL_USER: eaorcs_user
      MYSQL_PASSWORD: eaorcs_secure_password_2026
      MYSQL_ROOT_PASSWORD: eaorcs_root_password_2026
    ports:
      - "3306:3306"
    volumes:
      - eaorcs-db-data:/var/lib/mysql
    networks:
      - eaorcs-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  eaorcs-redis:
    image: redis:7-alpine
    container_name: eaorcs-redis-cache
    restart: always
    command: redis-server --appendonly yes --requirepass eaorcs_redis_password_2026
    ports:
      - "6379:6379"
    volumes:
      - eaorcs-redis-data:/data
    networks:
      - eaorcs-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  eaorcs-network:
    driver: bridge

volumes:
  eaorcs-storage:
  eaorcs-audits:
  eaorcs-db-data:
  eaorcs-redis-data:
